spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000

  jpa:
    show-sql: false

  flyway:
    clean-disabled: true

karflow:
  jwt:
    secret: ${JWT_SECRET}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost}
  mail:
    from: ${MAIL_FROM:noreply@karflow.ma}
  file:
    upload-dir: ${UPLOAD_DIR:/app/uploads}
    base-url: ${FILE_BASE_URL:http://localhost/api/v1/files}

logging:
  level:
    ma.karflow: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
